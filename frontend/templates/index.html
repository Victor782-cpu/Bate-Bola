<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BateBola</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="/static/css/style.css" />
    <meta name="theme-color" content="#f8f9fa" id="meta-theme-color">
    <script>
        (function() {
            try {
                const saved = localStorage.getItem('batebola_theme');
                const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                if (saved === 'dark' || (!saved && prefersDark)) {
                    document.documentElement.setAttribute('data-theme', 'dark');
                    const meta = document.getElementById('meta-theme-color');
                    if (meta) meta.setAttribute('content', '#0b0f19');
                }
            } catch(e) {}
        })();
    </script>
</head>

<body>

    <aside class="sidebar">
        <div class="sidebar-top">
            <button class="menu-toggle"><i class="fa-solid fa-xmark"></i></button>
            <a href="index.html" class="nav-icon active"><i class="fa-solid fa-house"></i></a>
            <a href="partidas.html" class="nav-icon"><i class="fa-solid fa-futbol"></i></a>
            <a href="historico.html" class="nav-icon"><i class="fa-regular fa-clock"></i></a>
        </div>

        <div class="sidebar-bottom">
            <hr class="divider" />
            <button class="nav-icon theme-toggle-btn" id="theme-toggle-sidebar" type="button" aria-label="Alternar modo escuro" title="Alternar modo escuro">
                <i class="fa-solid fa-moon icon-moon"></i>
                <i class="fa-solid fa-sun icon-sun"></i>
            </button>
            <a href="login.html" class="nav-icon"><i class="fa-regular fa-user"></i></a>
            <a href="#" class="nav-icon"><i class="fa-solid fa-right-from-bracket"></i></a>
        </div>
    </aside>

    <div class="main-content">

        <header class="top-header">
            <div class="header-left">
                <button class="menu-toggle" id="btn-abrir-menu"><i class="fa-solid fa-bars"></i></button>
            <a href="index.html" class="logo">
                <img src="/static/img/image 8.png" alt="Logo">
            </a>
            </div>
            <div class="header-right">
                <button class="theme-toggle-btn" id="theme-toggle-header" type="button" aria-label="Alternar modo escuro" title="Alternar modo escuro">
                    <i class="fa-solid fa-moon icon-moon"></i>
                    <i class="fa-solid fa-sun icon-sun"></i>
                </button>
            </div>
        </header>

        <section class="banner">
            <div class="banner-content">
                <h2>Seu próximo jogo <br><span class="highlight">começa aqui!</span></h2>
                <a href="partidas.html" class="btn-primary">Encontre Partidas</a>
            </div>
        </section>

        <section class="sports-section" id="esportes">
            <h2>Escolha seu esporte</h2>
            <div class="galeria">
                <div class="card sport-card" data-esporte="Futebol" title="Ver partidas de Futebol">
                    <i class="fa-solid fa-futbol card-icon"></i>
                    <h3>Futebol</h3>
                    <span class="active-indicator"></span>
                </div>
                <div class="card sport-card" data-esporte="Futsal" title="Ver partidas de Futsal">
                    <i class="fa-solid fa-futbol card-icon"></i>
                    <h3>Futsal</h3>
                    <span class="active-indicator"></span>
                </div>
                <div class="card sport-card" data-esporte="Basquete" title="Ver partidas de Basquete">
                    <i class="fa-solid fa-basketball card-icon"></i>
                    <h3>Basquete</h3>
                    <span class="active-indicator"></span>
                </div>
                <div class="card sport-card" data-esporte="Vôlei" title="Ver partidas de Vôlei">
                    <i class="fa-solid fa-volleyball fa-volleyball-ball card-icon"></i>
                    <h3>Vôlei</h3>
                    <span class="active-indicator"></span>
                </div>
            </div>
        </section>

    </div>
    <script src="/static/js/script.js"></script>
</body>

</html>
