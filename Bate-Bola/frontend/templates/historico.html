<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Histórico de Partidas - BateBola</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="/static/css/style.css" />
    <meta name="theme-color" content="#f8f9fa" id="meta-theme-color">
    <script>
        (function() {
            try {
                const saved = localStorage.getItem('batebola_theme');
                const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                if (saved === 'dark' || (!saved && prefersDark)) {
                    document.documentElement.setAttribute('data-theme', 'dark');
                    const meta = document.getElementById('meta-theme-color');
                    if (meta) meta.setAttribute('content', '#0b0f19');
                }
            } catch(e) {}
        })();
    </script>
</head>

<body>

    <aside class="sidebar">
        <div class="sidebar-top">
            <button class="menu-toggle"><i class="fa-solid fa-xmark"></i></button>
            <a href="index.html" class="nav-icon" title="Início"><i class="fa-solid fa-house"></i></a>
            <a href="partidas.html" class="nav-icon" title="Partidas"><i class="fa-solid fa-futbol"></i></a>
            <a href="historico.html" class="nav-icon active" title="Histórico"><i class="fa-regular fa-clock"></i></a>
        </div>

        <div class="sidebar-bottom">
            <hr class="divider" />
            <button class="nav-icon theme-toggle-btn" id="theme-toggle-sidebar" type="button" aria-label="Alternar modo escuro" title="Alternar modo escuro">
                <i class="fa-solid fa-moon icon-moon"></i>
                <i class="fa-solid fa-sun icon-sun"></i>
            </button>
            <a href="perfil.html" class="nav-icon" title="Perfil"><i class="fa-regular fa-user"></i></a>
            <a href="#" class="nav-icon" id="btn-logout" title="Sair"><i class="fa-solid fa-right-from-bracket"></i></a>
        </div>
    </aside>

    <div class="main-content">

        <header class="top-header">
            <div class="header-left">
                <button class="menu-toggle"><i class="fa-solid fa-bars"></i></button>
            <a href="index.html" class="logo">
                <img src="/static/img/image 8.png" alt="Logo">
            </a>
            </div>
            <div class="header-right">
                <button class="theme-toggle-btn" id="theme-toggle-header" type="button" aria-label="Alternar modo escuro" title="Alternar modo escuro">
                    <i class="fa-solid fa-moon icon-moon"></i>
                    <i class="fa-solid fa-sun icon-sun"></i>
                </button>
            </div>
        </header>

        <main class="partidas-container">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                <h1 class="page-title" style="margin-bottom: 0;">Histórico de Partidas</h1>
            </div>

            <section class="cards-grid" id="container-historico">
                <p style="grid-column: 1/-1; color: #64748b;">Carregando histórico...</p>
            </section>
        </main>

    </div>

    <!-- Modal de Avaliação de Jogadores -->
    <div id="modal-avaliar" class="modal">
        <div class="modal-content" style="max-width: 480px;">
            <h3>Avaliar Jogadores da Partida</h3>
            <p style="font-size: 0.9rem; color: #64748b; margin-bottom: 1rem;">
                Dê uma nota de 1 a 5 para os atletas que jogaram com você:
            </p>
            
            <form id="form-avaliacao">
                <input type="hidden" id="partida-avaliar-id" />
                <div id="lista-jogadores-avaliar" style="display: flex; flex-direction: column; gap: 0.75rem; max-height: 250px; overflow-y: auto; margin-bottom: 1.5rem; padding-right: 0.5rem;">
                    <!-- Lista inserida dinamicamente via JS -->
                </div>

                <div class="form-actions">
                    <button type="button" id="btn-fechar-avaliar" class="btn-cancelar">Cancelar</button>
                    <button type="submit" class="btn-salvar">Enviar Avaliações</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/static/js/script.js"></script>
</body>

</html>
